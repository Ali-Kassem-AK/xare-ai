<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-labelledby="demoTitle demoDesc">
  <title id="demoTitle">Xare AI — Walkthrough GIF / Video Demo Slot</title>
  <desc id="demoDesc">Replaceable slot for a short product walkthrough GIF or video preview of Xare AI. Replace docs/images/xare-ai-demo-preview-placeholder.svg with a recorded GIF or link to a video walkthrough.</desc>
  <defs>
    <linearGradient id="dBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="50%" stop-color="#081226" />
      <stop offset="100%" stop-color="#0b1730" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d9bf0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#dBg)" stroke="#1e293b" stroke-width="2" />
  <rect x="28" y="24" width="1144" height="312" rx="14" fill="#070e1c" stroke="#1d9bf0" stroke-width="1.2" stroke-dasharray="6 4" />

  <!-- Play Button Centerpiece -->
  <circle cx="600" cy="145" r="46" fill="#0c2444" stroke="#38bdf8" stroke-width="2" />
  <circle cx="600" cy="145" r="34" fill="url(#playGrad)" />
  <polygon points="592,129 618,145 592,161" fill="#ffffff" />

  <text x="600" y="224" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="0.4">WALKTHROUGH GIF / VIDEO PREVIEW SLOT</text>
  <text x="600" y="250" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Replace this SVG with a 15–30s screen recording demonstrating streaming chat, live HTML5 sandbox builds, and multimodal uploads.</text>
  <rect x="370" y="270" width="460" height="32" rx="8" fill="#0b162c" stroke="#334155" stroke-width="1" />
  <text x="600" y="290" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">File Path: docs/images/xare-ai-demo-preview-placeholder.svg</text>
</svg>
