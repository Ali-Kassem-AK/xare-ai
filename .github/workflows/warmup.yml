name: Xare AI 1-Hour Chat Warm-Up Subsystem

on:
  schedule:
    # Runs every 1 hour continuously: 00:00, 01:00, 02:00, 03:00, ..., 23:00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target warm-up mechanism'
        required: true
        default: 'browser'
        type: choice
        options:
          - browser
          - all
          - n8n
          - edge
      repeat:
        description: 'Number of consecutive warm-up iterations (for benchmarking)'
        required: false
        default: '1'
        type: string

concurrency:
  group: xare-chat-warmup
  cancel-in-progress: false

jobs:
  execute-warmup:
    name: Run Synthetic Chat Warm-Up & Verify Inference
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate Upstream Secret Configuration
        run: |
          TARGET="${{ inputs.target || 'browser' }}"
          if [ "$TARGET" = "n8n" ] || [ "$TARGET" = "all" ]; then
            if [ -z "${{ secrets.N8N_WEBHOOK_TOKEN }}" ]; then
              echo "::warning::N8N_WEBHOOK_TOKEN is not configured; direct n8n webhook calls will fail closed."
            fi
          fi
          if [ "$TARGET" = "edge" ] || [ "$TARGET" = "all" ]; then
            if [ -z "${{ secrets.WARMUP_SECRET }}" ]; then
              echo "::warning::WARMUP_SECRET is not configured; direct edge calls will fail closed."
            fi
          fi

      - name: Execute Synthetic User Turn ('Hi') & Record Proof
        env:
          WARMUP_SECRET: ${{ secrets.WARMUP_SECRET }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          VERCEL_APP_URL: ${{ vars.VERCEL_APP_URL || 'https://xare-ai.vercel.app' }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL || 'https://aliiis-24-7-n8n.hf.space/webhook/xare-ai-v2-guALIharika' }}
        run: |
          node scripts/warmup_runner.cjs --target=${{ inputs.target || 'browser' }} --repeat=${{ inputs.repeat || '1' }} --report

      - name: Upload Telemetry & Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warmup-telemetry-evidence-${{ github.run_id }}
          path: docs/warmup/
          if-no-files-found: ignore
          retention-days: 90
