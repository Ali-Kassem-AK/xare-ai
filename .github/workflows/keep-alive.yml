name: 🤗 HuggingFace Space Keep-Alive

# Scheduled execution cadence:
# Runs at minutes 7, 27, and 47 past each hour (UTC):
# - 20-minute cadence provides frequent wakeups to prevent inactivity timeout on Hugging Face Spaces.
# - Offsetting from :00 and :30 avoids the heaviest runner queue spikes on GitHub Actions.
# NOTE: GitHub Actions schedule triggers are best-effort; runner load may introduce jitter (5-30m).
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      force_heartbeat:
        description: "Force heartbeat file update regardless of elapsed time"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  actions: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Keep-Alive & Self-Healing Monitor
        id: monitor
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_IDS: ${{ vars.SPACE_IDS || 'AliiiS/24-7_n8n,AliiiS/pdf-to-image-api' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          WATCHDOG_CHECKIN_URL: ${{ secrets.WATCHDOG_CHECKIN_URL }}
        run: python scripts/keep_alive_monitor.py

      - name: Evaluate 60-Day Inactivity Prevention Heartbeat
        # Runs on scheduled runs or manual forced triggers, even if the monitor step failed.
        if: always() && !cancelled() && (github.event_name == 'schedule' || inputs.force_heartbeat == true)
        id: heartbeat
        run: |
          if [ "${{ inputs.force_heartbeat }}" = "true" ]; then
            python -c "import scripts.heartbeat_manager as hm; hm.write_heartbeat(); print('Forced heartbeat written')"
            echo "heartbeat_updated=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/heartbeat_manager.py
          fi

      - name: Commit and Push Heartbeat (When Threshold Reached)
        if: always() && !cancelled() && steps.heartbeat.outputs.heartbeat_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-keepalive
          git diff --staged --quiet || (git commit -m "chore: refresh keep-alive heartbeat to prevent 60-day schedule disable [skip ci]" && git push origin HEAD)

      - name: Enforce Overall Job Status & Dispatch Failure Alert
        # If the health monitor step failed, dispatch alert and fail the overall run.
        if: always() && !cancelled() && steps.monitor.outcome == 'failure'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -c "import scripts.alert_manager as am, os; am.notify_incident(os.environ.get('ALERT_WEBHOOK_URL'), category='WORKFLOW_FAILED', severity='CRITICAL', title='Keep-Alive Workflow Failed', summary='One or more Spaces failed health verification and recovery in run ${{ github.run_id }}.', run_url=os.environ.get('GITHUB_RUN_URL'))"
          echo "::error::Hugging Face Space Keep-Alive Monitor failed. One or more Spaces are unhealthy or unrecoverable."
          exit 1
